<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Downloader</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { font-family: sans-serif; }
    .container { width: 80%; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
    th input[type="checkbox"] { transform: scale(1.2); }
    .controls { margin-top: 15px; }
    button { padding: 8px 14px; margin-right: 10px; }
    .status.pending { color: gray; }
    .status.downloading { color: orange; }
    .status.success { color: green; }
    .status.error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Song Downloader</h1>

    <form id="upload-form" method="POST" enctype="multipart/form-data">
      <input type="file" name="csv_file" required>
      <button type="submit">Upload CSV</button>
    </form>

    {% if songs %}
    <hr>
    <div class="controls">
      <button id="select-all">Select All</button>
      <button id="download-selected">Download Selected</button>
      <button id="retry-failed">Retry Failed</button>
    </div>

    <table id="songs-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="master-checkbox"></th>
          <th>Song</th>
          <th>Artist</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for song in songs %}
        <tr data-index="{{ loop.index0 }}">
          <td><input type="checkbox" class="row-checkbox" data-index="{{ loop.index0 }}"></td>
          <td>{{ song.Song }}</td>
          <td>{{ song.Artist }}</td>
          <td class="status pending">Pending</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
  </div>

  <script>
    document.getElementById('select-all')?.addEventListener('click', () => {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = true);
    });

    document.getElementById('master-checkbox')?.addEventListener('change', (e) => {
      const checked = e.target.checked;
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
    });

    document.getElementById('download-selected')?.addEventListener('click', async () => {
      const selected = [...document.querySelectorAll('.row-checkbox')]
        .filter(cb => cb.checked)
        .map(cb => cb.dataset.index);

      if (selected.length === 0) {
        alert("Please select at least one song.");
        return;
      }

      for (const idx of selected) {
        const row = document.querySelector(`tr[data-index="${idx}"]`);
        const statusCell = row.querySelector('.status');
        statusCell.textContent = "Downloading...";
        statusCell.className = "status downloading";

        try {
          const res = await fetch('/download-ajax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ index: idx })
          });
          const result = await res.json();
          if (result.success) {
            statusCell.textContent = "✅ Done";
            statusCell.className = "status success";
          } else {
            statusCell.textContent = "❌ Failed";
            statusCell.className = "status error";
          }
        } catch (err) {
          console.error(err);
          statusCell.textContent = "❌ Error";
          statusCell.className = "status error";
        }
      }
    });
  </script>
</body>
</html>
