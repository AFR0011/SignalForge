<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SignalForge interface overview</title>
  <desc id="desc">An illustrated overview of the verified SignalForge local interface using three synthetic tracks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a23"/>
      <stop offset="1" stop-color="#102d34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79f2c0"/>
      <stop offset="1" stop-color="#44c8b1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="80" r="250" fill="#1c5960" opacity=".22"/>
  <circle cx="80" cy="810" r="260" fill="#0b8271" opacity=".16"/>

  <g filter="url(#shadow)">
    <rect x="80" y="56" width="1280" height="788" rx="24" fill="#f5f8f5"/>
    <rect x="80" y="56" width="1280" height="58" rx="24" fill="#10242b"/>
    <rect x="80" y="90" width="1280" height="24" fill="#10242b"/>
  </g>

  <circle cx="118" cy="85" r="7" fill="#ff7068"/>
  <circle cx="143" cy="85" r="7" fill="#ffc75f"/>
  <circle cx="168" cy="85" r="7" fill="#79f2c0"/>
  <text x="208" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e9fff7">Signal Forge</text>
  <rect x="1048" y="73" width="266" height="25" rx="13" fill="#183941"/>
  <circle cx="1069" cy="86" r="5" fill="#79f2c0"/>
  <text x="1082" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cce7de">Private process-local job</text>

  <text x="126" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#258b78">CSV → AUDIO WORKSPACE</text>
  <text x="126" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#10242b">Turn a track list into an organized audio queue.</text>
  <text x="126" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#567078">Synthetic data · no live-provider request · no media download</text>

  <rect x="126" y="270" width="330" height="510" rx="18" fill="#e7efeb"/>
  <text x="154" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#258b78">02 / OVERVIEW</text>
  <text x="154" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#10242b">Job dashboard</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="154" y="374" width="128" height="78" rx="12" fill="#fff"/>
    <text x="172" y="400" font-size="13" fill="#657a80">Total tracks</text>
    <text x="172" y="435" font-size="30" font-weight="700" fill="#10242b">3</text>
    <rect x="298" y="374" width="128" height="78" rx="12" fill="#fff"/>
    <text x="316" y="400" font-size="13" fill="#657a80">Selected</text>
    <text x="316" y="435" font-size="30" font-weight="700" fill="#10242b">3</text>

    <rect x="154" y="466" width="128" height="78" rx="12" fill="#fff"/>
    <text x="172" y="492" font-size="13" fill="#657a80">Saved</text>
    <text x="172" y="527" font-size="30" font-weight="700" fill="#10242b">0</text>
    <rect x="298" y="466" width="128" height="78" rx="12" fill="#fff"/>
    <text x="316" y="492" font-size="13" fill="#657a80">Needs retry</text>
    <text x="316" y="527" font-size="30" font-weight="700" fill="#10242b">0</text>

    <text x="154" y="585" font-size="13" fill="#657a80">Overall progress</text>
    <text x="398" y="585" text-anchor="end" font-size="13" font-weight="700" fill="#10242b">0%</text>
    <rect x="154" y="600" width="244" height="10" rx="5" fill="#cad8d4"/>
    <rect x="154" y="600" width="8" height="10" rx="5" fill="url(#accent)"/>

    <rect x="154" y="646" width="244" height="74" rx="12" fill="#10242b"/>
    <text x="174" y="675" font-size="12" font-weight="700" letter-spacing="1.5" fill="#79f2c0">BOUNDARY</text>
    <text x="174" y="700" font-size="14" fill="#e9fff7">One worker · isolated jobs</text>
  </g>

  <rect x="480" y="270" width="834" height="510" rx="18" fill="#fff" stroke="#dbe6e2"/>
  <text x="512" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#258b78">03 / QUEUE</text>
  <text x="512" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#10242b">Choose what to process</text>
  <text x="512" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#657a80">Queue the full imported list</text>

  <rect x="923" y="307" width="104" height="40" rx="10" fill="#dcebe6"/>
  <text x="975" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#194f46">Select all</text>
  <rect x="1039" y="307" width="132" height="40" rx="10" fill="url(#accent)"/>
  <text x="1105" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#092d29">Start selected</text>
  <rect x="1183" y="307" width="99" height="40" rx="10" fill="#eef3f1"/>
  <text x="1232" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#526a70">Clear job</text>

  <rect x="512" y="400" width="770" height="48" rx="10" fill="#10242b"/>
  <text x="544" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#dceae5">✓</text>
  <text x="584" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#dceae5">TRACK</text>
  <text x="826" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#dceae5">ARTIST</text>
  <text x="1036" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#dceae5">ALBUM</text>
  <text x="1190" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#dceae5">STATUS</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="512" y="460" width="770" height="78" rx="10" fill="#f5f8f5"/>
    <rect x="532" y="487" width="20" height="20" rx="5" fill="#44c8b1"/>
    <path d="M537 497l4 4 7-9" fill="none" stroke="#082f2b" stroke-width="2.5"/>
    <text x="584" y="492" font-size="16" font-weight="700" fill="#10242b">Midnight Drive</text>
    <text x="584" y="516" font-size="12" fill="#789096">Electronic · Synthwave</text>
    <text x="826" y="502" font-size="14" fill="#324d54">Nova Lines</text>
    <text x="1036" y="502" font-size="14" fill="#324d54">Afterglow</text>
    <rect x="1178" y="482" width="84" height="28" rx="14" fill="#dff5eb"/>
    <text x="1220" y="501" text-anchor="middle" font-size="12" font-weight="700" fill="#23725f">Ready</text>

    <rect x="512" y="550" width="770" height="78" rx="10" fill="#f5f8f5"/>
    <rect x="532" y="577" width="20" height="20" rx="5" fill="#44c8b1"/>
    <path d="M537 587l4 4 7-9" fill="none" stroke="#082f2b" stroke-width="2.5"/>
    <text x="584" y="582" font-size="16" font-weight="700" fill="#10242b">Paper Moons</text>
    <text x="584" y="606" font-size="12" fill="#789096">Indie</text>
    <text x="826" y="592" font-size="14" fill="#324d54">The Low Signals</text>
    <text x="1036" y="592" font-size="14" fill="#324d54">Northbound</text>
    <rect x="1178" y="572" width="84" height="28" rx="14" fill="#dff5eb"/>
    <text x="1220" y="591" text-anchor="middle" font-size="12" font-weight="700" fill="#23725f">Ready</text>

    <rect x="512" y="640" width="770" height="78" rx="10" fill="#f5f8f5"/>
    <rect x="532" y="667" width="20" height="20" rx="5" fill="#44c8b1"/>
    <path d="M537 677l4 4 7-9" fill="none" stroke="#082f2b" stroke-width="2.5"/>
    <text x="584" y="672" font-size="16" font-weight="700" fill="#10242b">Static Bloom</text>
    <text x="584" y="696" font-size="12" fill="#789096">Ambient · Dream Pop</text>
    <text x="826" y="682" font-size="14" fill="#324d54">Juniper Vale</text>
    <text x="1036" y="682" font-size="14" fill="#324d54">Color Field</text>
    <rect x="1178" y="662" width="84" height="28" rx="14" fill="#dff5eb"/>
    <text x="1220" y="681" text-anchor="middle" font-size="12" font-weight="700" fill="#23725f">Ready</text>
  </g>

  <text x="720" y="824" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5d747a">Illustrated from the verified local interface · synthetic data only</text>
</svg>
